baseURL = "https://fevnem.github.io/"
locale = "en-us"
title = "Rakib Hasan"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 4
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 5
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 6

[params]
  env = "production"
  title = "Rakib Hasan"
  description = "Personal digital garden — notes and deep-dives on software, systems, and the web."
  keywords = ["blog", "software", "web development", "digital garden"]
  author = "Rakib Hasan"
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  ShowToc = true
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "I build things for the <span class=\"grad-text\">web</span>."
    Content = "Software engineer exploring systems, performance, and everything in between. This is my digital garden — a growing collection of notes, deep-dives, and ideas I'm cultivating."

  [params.footer]
    hideCopyright = false
    text = "crafted with ☕ &amp; curiosity"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/fevnem"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.assets]
    disableHLJS = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
