baseURL = "https://fevnem.github.io/"
locale = "en-us"
title = "Rakib Hasan"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 4

[params]
env = "production"
title = "Rakib Hasan"
description = "Personal digital garden — notes and deep-dives on software, systems, and the web."
keywords = ["blog", "software", "web development", "digital garden"]
author = "Rakib Hasan"
tagline = "Software engineer. Writing about systems, the web, and building things."
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = true
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true
mainSections = ["posts"]

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/fevnem"
[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

[params.assets]
  disableHLJS = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
