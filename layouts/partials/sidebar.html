<aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
        <div class="sidebar-top">
            <div class="sidebar-head">
                <a class="sidebar-brand" href="{{ "" | absLangURL }}">{{ site.Title }}</a>
                {{ partial "social_icons.html" (dict "align" "center") }}
            </div>
            {{- with site.Params.tagline }}
            <p class="sidebar-tagline">{{ . }}</p>
            {{- end }}
        </div>
        <nav class="sidebar-nav" aria-label="Main">
            <ul>
                {{- range .Site.Menus.main }}
                <li>
                    <a href="{{ .URL | absLangURL }}"
                        {{- if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} class="active" aria-current="page"{{- end }}>
                        {{ .Name }}
                    </a>
                </li>
                {{- end }}
            </ul>
        </nav>
        <div class="sidebar-social">
            <button id="theme-toggle" class="theme-toggle sidebar-toggle" accesskey="t" title="(Alt + T)" aria-label="Toggle theme">
                <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
        <div class="sidebar-foot">
            <span>© {{ now.Year }} {{ site.Title }}</span>
            <span class="sidebar-foot-note">Built with <a href="https://gohugo.io/?utm_source=papermod" rel="noopener" target="_blank">Hugo</a> &amp; <a href="https://github.com/adityatelange/hugo-PaperMod/" rel="noopener" target="_blank">PaperMod</a></span>
        </div>
    </div>
</aside>
