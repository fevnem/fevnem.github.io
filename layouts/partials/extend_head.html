{{- /* Aurora Garden — head extensions: favicon, fonts, meta */ -}}
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}" />
<link rel="apple-touch-icon" href="{{ "images/avatar.webp" | absURL }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)" />

{{- $og := "images/og-banner.webp" | absURL -}}
<meta property="og:image" content="{{ $og }}" />
<meta property="og:image:width" content="1024" />
<meta property="og:image:height" content="576" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ $og }}" />
